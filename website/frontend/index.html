<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanguard — Make Local AI Effortless</title>
  <link rel="stylesheet" href="css/styles.css">

  <!-- Three.js + GSAP loaded as native ES modules straight from a CDN — no
       bundler, no build step, consistent with the rest of this project. This
       is the first external network request the site makes; if it's
       unreachable (offline, CDN down), js/core.js catches that and the rest
       of the page — background, text, everything already built — is
       entirely unaffected. GSAP is added this pass specifically for
       ScrollTrigger (the scroll timeline driving the phase sequence) and for
       genuinely eased, interruptible tweens on the "Snap" transition — see
       the Teacher Mode note at the top of core.js for why those two jobs
       are GSAP's and the rest of the per-frame math stays plain JS. -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "gsap": "https://unpkg.com/gsap@3.12.5/index.js",
        "gsap/ScrollTrigger": "https://unpkg.com/gsap@3.12.5/ScrollTrigger.js"
      }
    }
  </script>
</head>
<body>

  <section class="hero">
    <div class="hero__glow" aria-hidden="true"></div>
    <canvas class="hero__core" aria-hidden="true"></canvas>
    <div class="hero__content">
      <p class="hero__logo">Vanguard</p>
      <h1 class="hero__mission">Make Local AI <span class="hero__mission-emphasis">Effortless.</span></h1>
      <p class="hero__supporting">Run powerful AI models on your own machine — no cloud, no complexity.</p>
    </div>
    <div class="hero__scroll-indicator" aria-hidden="true"></div>
  </section>

  <div class="hero__scroll-runway"></div>

  <script src="js/main.js" defer></script>
  <script type="module" src="js/core.js"></script>
</body>
</html>
